<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 610" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a94a6"/>
    </marker>
    <style>
      .t  { font-size: 14px; font-weight: 700; fill: #1b2230; }
      .d  { font-size: 11.5px; fill: #3d4757; }
      .m  { font-family: JetBrains Mono, Menlo, Consolas, monospace; font-size: 11px; fill: #1b2230; }
      .n  { font-size: 11px; font-weight: 700; fill: #fff; }
      .lab{ font-size: 14px; font-weight: 700; fill: #1b2230; }
      .sub{ font-size: 11.5px; fill: #5b6576; }
      .hdr{ font-size: 12px; font-weight: 700; fill: #5b6576; letter-spacing: .08em; }
    </style>
  </defs>

  <rect width="1040" height="610" fill="#ffffff"/>

  <!-- column headers -->
  <text x="330" y="36" class="hdr" text-anchor="middle">STAGE 1</text>
  <text x="610" y="36" class="hdr" text-anchor="middle">STAGE 2</text>
  <text x="890" y="36" class="hdr" text-anchor="middle">STAGE 3</text>

  <!-- ============ ROW 1: regular online wallet ============ -->
  <text x="20" y="100" class="lab">Online wallet</text>
  <text x="20" y="118" class="sub">single signer,</text>
  <text x="20" y="133" class="sub">normal transaction</text>

  <g transform="translate(210,60)">
    <rect width="240" height="130" rx="10" fill="#fdecec" stroke="#d64545" stroke-width="1.5"/>
    <circle cx="20" cy="22" r="10" fill="#d64545"/><text x="20" y="26" class="n" text-anchor="middle">1</text>
    <text x="38" y="27" class="t">Blind signing</text>
    <text x="14" y="52" class="d">Device signs opaque bytes.</text>
    <text x="14" y="68" class="d">User trusts the host screen.</text>
    <rect x="14" y="84" width="212" height="32" rx="5" fill="#fff" stroke="#e8b4b4"/>
    <text x="22" y="104" class="m">Sign 0x02a1f3…9c?</text>
  </g>
  <line x1="452" y1="125" x2="486" y2="125" stroke="#8a94a6" stroke-width="2" marker-end="url(#arr)"/>
  <g transform="translate(490,60)">
    <rect width="240" height="130" rx="10" fill="#e8f6ee" stroke="#2e9e5b" stroke-width="1.5"/>
    <circle cx="20" cy="22" r="10" fill="#2e9e5b"/><text x="20" y="26" class="n" text-anchor="middle">2</text>
    <text x="38" y="27" class="t">Clear signing</text>
    <text x="14" y="52" class="d">Device decodes instructions</text>
    <text x="14" y="68" class="d">via IDL. What you see = what runs.</text>
    <rect x="14" y="84" width="212" height="32" rx="5" fill="#fff" stroke="#a9dcbf"/>
    <text x="22" y="104" class="m">Transfer 5 SOL → 9xQe…</text>
  </g>
  <g transform="translate(770,60)">
    <rect width="240" height="130" rx="10" fill="#f6f7f9" stroke="#d5d9e0" stroke-dasharray="5 4"/>
    <text x="120" y="62" class="d" text-anchor="middle">Done — the transaction</text>
    <text x="120" y="78" class="d" text-anchor="middle">itself carries all the content.</text>
  </g>

  <!-- ============ ROW 2: Squads online ============ -->
  <text x="20" y="250" class="lab">Squads — online</text>
  <text x="20" y="268" class="sub">member wallet has</text>
  <text x="20" y="283" class="sub">RPC access</text>

  <g transform="translate(210,210)">
    <rect width="240" height="130" rx="10" fill="#fdecec" stroke="#d64545" stroke-width="1.5"/>
    <circle cx="20" cy="22" r="10" fill="#d64545"/><text x="20" y="26" class="n" text-anchor="middle">1</text>
    <text x="38" y="27" class="t">Blind signing</text>
    <text x="14" y="52" class="d">Vote transaction signed as</text>
    <text x="14" y="68" class="d">raw bytes.</text>
    <rect x="14" y="84" width="212" height="32" rx="5" fill="#fff" stroke="#e8b4b4"/>
    <text x="22" y="104" class="m">Sign 0x7c90de…41?</text>
  </g>
  <line x1="452" y1="275" x2="486" y2="275" stroke="#8a94a6" stroke-width="2" marker-end="url(#arr)"/>
  <g transform="translate(490,210)">
    <rect width="240" height="130" rx="10" fill="#fff6e0" stroke="#e0a100" stroke-width="1.5"/>
    <circle cx="20" cy="22" r="10" fill="#e0a100"/><text x="20" y="26" class="n" text-anchor="middle">2</text>
    <text x="38" y="27" class="t">Clear signing</text>
    <text x="14" y="52" class="d">The vote is decoded — but the</text>
    <text x="14" y="68" class="d">proposal's content is on-chain.</text>
    <rect x="14" y="84" width="212" height="32" rx="5" fill="#fff" stroke="#f0d48a"/>
    <text x="22" y="104" class="m">Approve proposal #42</text>
  </g>
  <line x1="732" y1="275" x2="766" y2="275" stroke="#8a94a6" stroke-width="2" marker-end="url(#arr)"/>
  <g transform="translate(770,210)">
    <rect width="240" height="130" rx="10" fill="#e8f6ee" stroke="#2e9e5b" stroke-width="1.5"/>
    <circle cx="20" cy="22" r="10" fill="#2e9e5b"/><text x="20" y="26" class="n" text-anchor="middle">3</text>
    <text x="38" y="27" class="t">+ chain introspection</text>
    <text x="14" y="52" class="d">Wallet fetches the VaultTransaction</text>
    <text x="14" y="68" class="d">over RPC and renders it.</text>
    <rect x="14" y="84" width="212" height="32" rx="5" fill="#fff" stroke="#a9dcbf"/>
    <text x="22" y="104" class="m">#42 → Upgrade prog Abc…</text>
  </g>

  <!-- ============ ROW 3: Squads offline ============ -->
  <text x="20" y="400" class="lab">Squads — offline</text>
  <text x="20" y="418" class="sub">air-gapped / hardware</text>
  <text x="20" y="433" class="sub">signer, no RPC</text>

  <g transform="translate(210,360)">
    <rect width="240" height="130" rx="10" fill="#fdecec" stroke="#d64545" stroke-width="1.5"/>
    <circle cx="20" cy="22" r="10" fill="#d64545"/><text x="20" y="26" class="n" text-anchor="middle">1</text>
    <text x="38" y="27" class="t">Blind signing</text>
    <text x="14" y="52" class="d">Device can't decode the</text>
    <text x="14" y="68" class="d">transaction at all.</text>
    <rect x="14" y="84" width="212" height="32" rx="5" fill="#fff" stroke="#e8b4b4"/>
    <text x="22" y="104" class="m">Sign 0x7c90de…41?</text>
  </g>
  <line x1="452" y1="425" x2="486" y2="425" stroke="#8a94a6" stroke-width="2" marker-end="url(#arr)"/>
  <g transform="translate(490,360)">
    <rect width="240" height="130" rx="10" fill="#fff6e0" stroke="#e0a100" stroke-width="1.5"/>
    <circle cx="20" cy="22" r="10" fill="#e0a100"/><text x="20" y="26" class="n" text-anchor="middle">2</text>
    <text x="38" y="27" class="t">Clear signing, no context</text>
    <text x="14" y="52" class="d">Vote decoded via IDL, but the</text>
    <text x="14" y="68" class="d">device can't read the chain.</text>
    <rect x="14" y="84" width="212" height="32" rx="5" fill="#fff" stroke="#f0d48a"/>
    <text x="22" y="104" class="m">Approve #42 → ??? </text>
  </g>
  <line x1="732" y1="425" x2="766" y2="425" stroke="#8a94a6" stroke-width="2" marker-end="url(#arr)"/>
  <g transform="translate(770,360)">
    <rect x="-4" y="-4" width="248" height="138" rx="13" fill="none" stroke="#2e9e5b" stroke-width="1" opacity=".5"/>
    <rect width="240" height="130" rx="10" fill="#e8f6ee" stroke="#2e9e5b" stroke-width="2.5"/>
    <circle cx="20" cy="22" r="10" fill="#2e9e5b"/><text x="20" y="26" class="n" text-anchor="middle">3</text>
    <text x="38" y="27" class="t">Clear signing via POC</text>
    <text x="14" y="52" class="d">Content travels inside the tx and</text>
    <text x="14" y="68" class="d">is enforced by the chain.</text>
    <rect x="14" y="84" width="212" height="32" rx="5" fill="#fff" stroke="#a9dcbf"/>
    <text x="22" y="104" class="m">#42 → Upgrade prog Abc…</text>
    <rect x="150" y="-11" width="82" height="20" rx="10" fill="#2e9e5b"/>
    <text x="191" y="3" class="n" text-anchor="middle">THIS POC</text>
  </g>

  <!-- ============ trust footer ============ -->
  <line x1="20" y1="522" x2="1020" y2="522" stroke="#e3e6eb"/>
  <text x="20" y="548" class="hdr">WHO MUST BE HONEST FOR THE SIGNER TO SEE THE TRUTH?</text>
  <circle cx="28" cy="574" r="6" fill="#d64545"/><text x="40" y="578" class="d">the host / coordinator machine</text>
  <circle cx="258" cy="574" r="6" fill="#e0a100"/><text x="270" y="578" class="d">host, for everything past "approve #N"</text>
  <circle cx="530" cy="574" r="6" fill="#2e9e5b"/><text x="542" y="578" class="d">online: the wallet + its RPC  ·  POC: only the chain + device IDL</text>
</svg>
